<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك اللعبة - NOVA Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ffffff;
            font-family: sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">استخدم أسهم لوحة المفاتيح للتحكم في المكعب</div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // إعداد المشهد والكاميرا والمصيّر
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إنشاء المكعب
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.4 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // إضاءة المشهد
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        camera.position.z = 5;

        // تتبع حالة مفاتيح الأسهم
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };

        window.addEventListener('keydown', (event) => {
            if (event.key in keys) {
                keys[event.key] = true;
            }
        });

        window.addEventListener('keyup', (event) => {
            if (event.key in keys) {
                keys[event.key] = false;
            }
        });

        // ضبط الحجم عند تغيير أبعاد النافذة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const moveSpeed = 0.08;

        // حلقة التحديث والرسم الرئيسية
        function animate() {
            requestAnimationFrame(animate);

            // تحريك المكعب في الاتجاهات الأربعة استناداً لحالة المفاتيح
            if (keys.ArrowUp) {
                cube.position.y += moveSpeed;
            }
            if (keys.ArrowDown) {
                cube.position.y -= moveSpeed;
            }
            if (keys.ArrowLeft) {
                cube.position.x -= moveSpeed;
            }
            if (keys.ArrowRight) {
                cube.position.x += moveSpeed;
            }

            // تدوير خفيف لإبراز الأبعاد الثلاثية
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
